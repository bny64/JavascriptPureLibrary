<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>업무 관리 시스템</title>
    <link rel="stylesheet" href="frontend/styles/core/base.css">
    <link rel="stylesheet" href="frontend/styles/layout/sidebar.css">
    <link rel="stylesheet" href="frontend/styles/layout/header.css">
    <link rel="stylesheet" href="frontend/styles/components/modal.css">
    <link rel="stylesheet" href="frontend/styles/components/category.css">
    <link rel="stylesheet" href="frontend/styles/components/dashboard.css">
    <link rel="stylesheet" href="frontend/styles/components/kanban.css">
    <link rel="stylesheet" href="frontend/styles/components/gantt.css">
    <link rel="stylesheet" href="frontend/styles/components/activity-log.css">
    <link rel="stylesheet" href="frontend/styles/effects/mouse-effect.css">
    <link rel="stylesheet" href="themes.css">
    <link rel="stylesheet" href="lib/frappe-gantt.css">
    <link rel="stylesheet" href="lib/quill.snow.css">
</head>

<body>
    <aside class="sidebar" id="mainSidebar">
        <div class="sidebar-header">
            <h2>메뉴</h2>
        </div>
        <ul class="sidebar-menu">
            <li><a href="#" id="sidebarDashboardLink" data-view="dashboard">📈 대시보드</a></li>
            <li><a href="#" id="sidebarCalendarLink" data-view="calendar">📅 일정 관리</a></li>
            <li><a href="#" id="sidebarGanttLink" data-view="gantt">📊 간트 차트</a></li>
            <li><a href="#" id="sidebarKanbanLink" data-view="kanban">📋 칸반 보드</a></li>
            <li><a href="#" id="sidebarSearchLink" data-view="search">🔍 업무 검색</a></li>
            <li><a href="#" id="sidebarReportLink" data-view="report">📊 성과 분석</a></li>
            <li><a href="#" id="sidebarActivityLogLink" data-view="activityLog">📜 활동 로그</a></li>
        </ul>
    </aside>
    <div class="container">
        <header>
            <div class="header-left">
                <div class="global-search-container">
                    <input type="text" id="globalSearchInput" placeholder="🔍 업무 제목, 내용 검색...">
                    <div id="globalSearchResults" class="global-search-results"></div>
                </div>
                <div class="theme-selector">
                    <label>테마:</label>
                    <div id="themeCircles" class="theme-circles">
                        <div class="theme-circle" data-theme="green" title="녹색"></div>
                        <div class="theme-circle" data-theme="blue" title="파란색"></div>
                        <div class="theme-circle" data-theme="purple" title="보라색"></div>
                        <div class="theme-circle" data-theme="orange" title="주황색"></div>
                        <div class="theme-circle" data-theme="pink" title="분홍색"></div>
                        <div class="theme-circle" data-theme="teal" title="청록색"></div>
                        <div class="theme-circle" data-theme="red" title="빨간색"></div>
                        <div class="theme-circle" data-theme="indigo" title="남색"></div>
                        <div class="theme-circle" data-theme="brown" title="갈색"></div>
                        <div class="theme-circle" data-theme="gray" title="회색"></div>
                    </div>
                </div>
                <div class="selector-group">
                    <div class="selector-item">
                        <label>효과:</label>
                        <div id="effectCircles" class="theme-circles">
                            <div class="theme-circle effect-circle" data-effect="star" title="별">🌟</div>
                            <div class="theme-circle effect-circle" data-effect="heart" title="하트">❤️</div>
                            <div class="theme-circle effect-circle" data-effect="petal" title="꽃잎">🌸</div>
                            <div class="theme-circle effect-circle" data-effect="off" title="끄기">🚫</div>
                        </div>
                    </div>
                    <input type="range" id="effectOpacityRange" min="0" max="1" step="0.1" value="1" title="효과 투명도">
                </div>
                <div class="selector-group cursor-group">
                    <div class="selector-item">
                        <label>커서:</label>
                        <div id="cursorCircles" class="theme-circles">
                            <div class="theme-circle cursor-circle" data-cursor="circle" title="원형">⭕</div>
                            <div class="theme-circle cursor-circle" data-cursor="dot" title="점">🔴</div>
                            <div class="theme-circle cursor-circle" data-cursor="triangle" title="삼각형">▶️</div>
                            <div class="theme-circle cursor-circle" data-cursor="star" title="별">⭐</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="header-buttons">
                <div class="notification-container">
                    <button id="notificationBtn" class="btn-notification">
                        🔔 <span id="notificationCount" class="notification-count">0</span>
                    </button>
                    <div id="notificationDropdown" class="notification-dropdown">
                        <h4 id="notificationDropdownTitle">1주일 이내 종료 예정 업무</h4>
                        <ul id="notificationList">
                            <!-- Notifications will be rendered here by JavaScript -->
                            <li>알림 없음</li>
                        </ul>
                    </div>
                </div>
                <button id="notificationSettingsBtn" class="btn-notification-settings">⚙️ 알림 설정</button>
                <button class="btn-category" id="openCategoryModalBtn">📁 분류 관리</button>
                <button class="btn-memo" id="openMemoBtn">📝 메모</button>
                <button class="btn-add" id="openTaskModalBtn">+ 새 업무 추가</button>
            </div>
        </header>

        <!-- 메모 드로어 (Drawer) -->
        <div id="memoDrawer" class="memo-drawer">
            <div class="memo-drawer-header">
                <h3>📝 전역 메모</h3>
                <button id="closeMemoBtn" class="btn-close">&times;</button>
            </div>
            <div class="memo-input-container">
                <textarea id="memoInput" placeholder="중요한 내용을 기록하세요..."></textarea>
                <button id="addMemoBtn" class="btn-add-memo">메모 저장</button>
            </div>
            <div id="memoList" class="memo-list">
                <!-- 메모 목록이 여기에 렌더링됩니다 -->
            </div>
        </div>

        <!-- 뷰 컨테이너 (내용은 동적으로 로드됨) -->
        <div id="dashboard-view" class="view-container" style="display: none;"></div>
        <div id="calendar-view" class="view-container" style="display: none;"></div>
        <div id="gantt-chart-view" class="view-container" style="display: none;"></div>
        <div id="kanban-view" class="view-container" style="display: none;"></div>
        <div id="search-view" class="view-container" style="display: none;"></div>
        <div id="report-view" class="view-container" style="display: none;"></div>
        <div id="activity-log-view" class="view-container" style="display: none;"></div>
    </div>

    <!-- 모달 주입 영역 -->
    <div id="modal-container"></div>

    <script src="lib/frappe-gantt.min.js"></script>
    <script src="lib/quill.min.js"></script>
    <script src="lib/chart.umd.js"></script>
    <script type="module" src="frontend/main.js?v=20240317"></script>
</body>

</html>
