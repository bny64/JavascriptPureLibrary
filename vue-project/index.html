<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>상품 관리</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/vee-validate@4.12.6/dist/vee-validate.js"></script>
    <script src="./CustomInput.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
</head>

<body>
    <div id="app">
        <div class="page-wrap">

            <!-- Header -->
            <div class="header">
                <h1>상품 관리</h1>
                <p>product.registry / v1.1</p>
            </div>

            <!-- Toolbar -->
            <div class="toolbar">
                <span class="badge">{{ products.length }}</span>
                <span style="font-size:13px; color:var(--muted)">개 상품</span>
                <div class="toolbar-right">
                    <div class="count-wrap">
                        <label>추가 수량</label>
                        <input class="count-input" type="number" v-model.number="addCount" min="1" max="20" />
                    </div>
                    <button class="btn btn-primary btn-sm" @click="addProducts">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5">
                            <line x1="12" y1="5" x2="12" y2="19" />
                            <line x1="5" y1="12" x2="19" y2="12" />
                        </svg>
                        상품 추가
                    </button>
                    <button class="btn btn-ghost btn-sm" @click="showResetPopup = true"
                        :disabled="products.length === 0">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5">
                            <polyline points="1 4 1 10 7 10" />
                            <path d="M3.51 15a9 9 0 1 0 .49-3.28" />
                        </svg>
                        전체 초기화
                    </button>
                </div>
            </div>

            <!-- Product list -->
            <div v-if="products.length > 0">
                <div class="list-header">
                    <div>#</div>
                    <div>날짜</div>
                    <div>상품명</div>
                    <div>가격</div>
                    <div></div>
                </div>
                <transition-group name="row" tag="div">
                    <div class="product-row" v-for="(product, index) in products" :key="product.id">
                        <div class="row-num">{{ index + 1 }}</div>
                        <div>
                            <custom-input :name="'date_' + product.id" type="date" :rules="validateDate"
                                v-model="product.date" placeholder="날짜 선택" />
                        </div>
                        <div>
                            <custom-input :name="'name_' + product.id" type="text" :rules="validateName"
                                v-model="product.name" placeholder="상품명 입력" />
                        </div>
                        <div>
                            <custom-input :name="'price_' + product.id" type="number" :rules="validatePrice"
                                v-model="product.price" placeholder="가격 입력" :is-price="true" suffix="원" />
                        </div>
                        <div class="row-del">
                            <button class="btn-icon" @click="removeProduct(product.id)" title="삭제">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2.5">
                                    <line x1="18" y1="6" x2="6" y2="18" />
                                    <line x1="6" y1="6" x2="18" y2="18" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </transition-group>
            </div>

            <!-- Empty state -->
            <div v-else class="empty-state">
                <div class="icon">📦</div>
                <p>추가된 상품이 없습니다. 상품 추가 버튼을 눌러주세요.</p>
            </div>

            <!-- Submit -->
            <div class="submit-area" v-if="products.length > 0">
                <button class="btn-submit" @click="onSubmit">저장하기</button>
            </div>
        </div>

        <!-- Reset Popup -->
        <div class="overlay" v-if="showResetPopup" @click.self="showResetPopup = false">
            <div class="popup">
                <h3>⚙️ 초기화 옵션</h3>
                <p>어떤 방식으로 초기화하시겠습니까?</p>
                <div class="popup-actions">
                    <button class="btn btn-danger" @click="resetAll">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5">
                            <polyline points="3 6 5 6 21 6" />
                            <path d="M19 6l-1 14H6L5 6" />
                            <path d="M10 11v6" />
                            <path d="M14 11v6" />
                            <path d="M9 6V4h6v2" />
                        </svg>
                        전체 삭제 (행 포함)
                    </button>
                    <button class="btn btn-success" @click="resetValues">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5">
                            <polyline points="1 4 1 10 7 10" />
                            <path d="M3.51 15a9 9 0 1 0 .49-3.28" />
                        </svg>
                        입력값만 초기화
                    </button>
                </div>
                <div class="popup-cancel">
                    <button @click="showResetPopup = false">취소</button>
                </div>
            </div>
        </div>

        <!-- Toast -->
        <div class="toast" v-if="toastVisible">✓ 저장되었습니다!</div>
    </div>

    <script>
        const { useForm, useField } = VeeValidate;
        const { createApp, ref } = Vue;

        let uid = 1;
        const makeProduct = () => ({ id: uid++, date: '', name: '', price: '' });

        createApp({
            components: { CustomInput },
            setup() {
                const { validate: validateForm, resetForm } = useForm();

                const products = ref([makeProduct()]);
                const addCount = ref(1);
                const showResetPopup = ref(false);
                const toastVisible = ref(false);

                const validateDate = (val) => {
                    if (!val) return '날짜를 입력해주세요.';
                    return true;
                };

                const validateName = (val) => {
                    if (!val || !val.trim()) return '상품명을 입력해주세요.';
                    if (val.trim().length < 2) return '상품명은 2자 이상이어야 합니다.';
                    return true;
                };

                const validatePrice = (val) => {
                    if (val === undefined || val === null || val === '') return '가격을 입력해주세요.';
                    if (isNaN(val) || Number(val) < 0) return '올바른 가격을 입력해주세요.';
                    return true;
                };

                const addProducts = () => {
                    const count = Math.max(1, Math.min(20, addCount.value || 1));
                    for (let i = 0; i < count; i++) products.value.push(makeProduct());
                };

                const removeProduct = (id) => {
                    products.value = products.value.filter(p => p.id !== id);
                };

                const resetAll = () => {
                    products.value = [];
                    showResetPopup.value = false;
                };

                const resetValues = () => {
                    // products 데이터 초기화
                    products.value.forEach(p => {
                        p.date = '';
                        p.name = '';
                        p.price = '';
                    });

                    // 현재 등록된 모든 필드의 빈 값을 values로 구성해서 resetForm에 전달
                    const emptyValues = {};
                    products.value.forEach(p => {
                        emptyValues['date_' + p.id] = '';
                        emptyValues['name_' + p.id] = '';
                        emptyValues['price_' + p.id] = '';
                    });
                    resetForm({ values: emptyValues });

                    showResetPopup.value = false;
                };

                const onSubmit = async () => {
                    const result = await validateForm();
                    if (result.valid) {
                        console.log('제출 데이터:', JSON.parse(JSON.stringify(products.value)));
                        toastVisible.value = true;
                        setTimeout(() => { toastVisible.value = false; }, 2500);
                    }
                };

                return {
                    products, addCount, showResetPopup, toastVisible,
                    validateDate, validateName, validatePrice,
                    addProducts, removeProduct, resetAll, resetValues, onSubmit
                };
            }
        }).mount('#app');
    </script>
</body>

</html>
