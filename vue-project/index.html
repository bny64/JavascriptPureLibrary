<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VeeValidate Samples Dashboard</title>
    <!-- 폐쇄망 환경을 고려한 로컬 라이브러리 참조 (Production/Optimized) -->
    <script src="./frontend/lib/vue.global.prod.js"></script>
    <script src="./frontend/lib/vee-validate.min.js"></script>
    <script src="./frontend/lib/chart.umd.min.js"></script>

    <!-- 공통 및 레이아웃 스타일 -->
    <link rel="stylesheet" href="./frontend/styles/style.css" />
    <link rel="stylesheet" href="./frontend/styles/dashboard-layout.css" />
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;600;700&display=swap"
        rel="stylesheet" />
</head>

<body>
    <!-- (중략: 대시보드 구조 동일) -->
    <div id="app">
        <!-- Dashboard 구조 동일 -->
        <div class="dashboard-container">
            <!-- Sidebar -->
            <aside class="dashboard-sidebar">
                <div class="sidebar-header">
                    <img src="./frontend/assets/logo.png" alt="Vue Logo" style="width: 48px; height: 48px; margin-bottom: 12px; filter: drop-shadow(0 0 8px rgba(66, 184, 131, 0.4));" />
                    <h2>Vue Library Lab</h2>
                    <p>Testing Sandbox</p>
                    
                    <div class="project-switcher">
                        <span class="switcher-label">Project Switch</span>
                        <button class="switcher-btn active" title="Vue Library Lab (Port 3001)">V</button>
                        <button class="switcher-btn" @click="switchToProject(3002)" title="Switch to React Library Lab (Port 3002)">R</button>
                    </div>
                </div>
                
                <!-- Server Status Error Msg -->
                <teleport to="body">
                    <div v-if="serverError" class="server-status-msg">
                        ⚠️ 서버가 실행중이지 않습니다. (Port: {{ targetPort }})
                    </div>
                </teleport>

                <div class="sidebar-search">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                    <input type="text" v-model="searchQuery" placeholder="컴포넌트 검색..." />
                </div>

                <nav class="sidebar-menu">
                    <template v-for="category in filteredMenuGroups" :key="category.name">
                        <div class="menu-category" v-if="category.items.length > 0">{{ category.name }}</div>
                        <div v-for="item in category.items" :key="item.id" class="menu-item"
                            :class="{ active: currentView === item.id }" @click="currentView = item.id">
                            {{ item.title }}
                            <span class="menu-item-desc">{{ item.desc }}</span>
                        </div>
                    </template>
                </nav>
            </aside>

            <!-- Main Content -->
            <main class="dashboard-main">
                <header class="main-header">
                    <h3>{{ currentMenuTitle }}</h3>
                </header>

                <section class="main-content">
                    <div class="content-inner">
                        <transition name="fade" mode="out-in">
                            <component :is="activeComponent"></component>
                        </transition>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script type="module">
        import CustomInput from './frontend/components/CustomInput.js';
        import ValidationLab from './frontend/modules/form-validation/ValidationLab.js';
        import BasicForm from './frontend/modules/form-validation/BasicForm.js';
        import ChartSample from './frontend/modules/visualization/ChartSample.js';
        import TermsAgreementSample from './frontend/modules/consents/samples/TermsAgreementSample.js';

        const { createApp, ref, computed } = Vue;

        const app = createApp({
            setup() {
                const searchQuery = ref('');
                const currentView = ref('validation-lab');

                const menuGroups = [
                    {
                        name: 'Vee-Validate',
                        items: [
                            {
                                id: 'validation-lab',
                                title: 'Validation Integrated Lab',
                                desc: '3종 유효성 검사 전략 비교 (Standard, Manual, Array)',
                                component: ValidationLab
                            },
                            {
                                id: 'basic-form',
                                title: 'Standard Hook Form',
                                desc: 'useForm 기반 실무형 단일 폼 샘플',
                                component: BasicForm
                            }
                        ]
                    },
                    {
                        name: 'Chart.js',
                        items: [
                            {
                                id: 'chart-js',
                                title: 'Basic Visualization',
                                desc: '다양한 차트 타입 및 데이터 연동',
                                component: ChartSample
                            }
                        ]
                    },
                    {
                        name: 'Process Flow',
                        items: [
                            {
                                id: 'terms-agreements',
                                title: 'Terms Agreements',
                                desc: '동적 팝업 시퀀스 기반 약관 동의 프로세스',
                                component: TermsAgreementSample
                            }
                        ]
                    }
                ];

                const allItems = computed(() => menuGroups.flatMap(g => g.items));

                const filteredMenuGroups = computed(() => {
                    const query = searchQuery.value.toLowerCase();
                    return menuGroups.map(group => {
                        const isGroupNameMatch = group.name.toLowerCase().includes(query);
                        return {
                            ...group,
                            items: group.items.filter(item =>
                                isGroupNameMatch ||
                                item.title.toLowerCase().includes(query) ||
                                item.desc.toLowerCase().includes(query)
                            )
                        };
                    });
                });

                const activeComponent = computed(() => {
                    const found = allItems.value.find(item => item.id === currentView.value);
                    return found ? found.component : null;
                });

                const currentMenuTitle = computed(() => {
                    const found = allItems.value.find(item => item.id === currentView.value);
                    return found ? found.title : 'Library Lab';
                });

                const serverError = ref(false);
                const targetPort = ref(null);

                const switchToProject = async (port) => {
                    targetPort.value = port;
                    try {
                        const controller = new AbortController();
                        const id = setTimeout(() => controller.abort(), 1500);
                        
                        // 서버 생존 확인
                        await fetch(`http://localhost:${port}/`, { 
                            mode: 'no-cors',
                            signal: controller.signal 
                        });
                        
                        clearTimeout(id);
                        window.location.href = `http://localhost:${port}/`;
                    } catch (e) {
                        serverError.value = true;
                        setTimeout(() => { serverError.value = false; }, 3000);
                    }
                };

                return {
                    searchQuery,
                    currentView,
                    menuGroups,
                    filteredMenuGroups,
                    activeComponent,
                    currentMenuTitle,
                    serverError,
                    targetPort,
                    switchToProject
                };
            }
        });

        // 공통 컴포넌트 등록
        app.component('custom-input', CustomInput);

        app.mount('#app');
    </script>
</body>

</html>
