<div class="modal-content task-modal-content">
    <span class="close">&times;</span>
    <h2 id="modalTitle">새 업무 추가</h2>
    <form id="taskForm">
        <input type="hidden" id="taskId">
        <div class="form-group">
            <label>대분류</label>
            <select id="category1" required>
                <option value="">선택하세요</option>
            </select>
        </div>
        <div class="form-group">
            <label>중분류</label>
            <select id="category2">
                <option value="">선택하세요</option>
            </select>
        </div>
        <div class="form-group">
            <label>소분류</label>
            <select id="category3">
                <option value="">선택하세요</option>
            </select>
        </div>
        <div class="form-group">
            <label>업무명</label>
            <input type="text" id="taskName" required placeholder="업무 이름을 입력하세요">
        </div>
        <div class="form-group">
            <label>시작 날짜</label>
            <input type="date" id="startDate">
        </div>
        <div class="form-group">
            <label>종료 날짜</label>
            <input type="date" id="endDate">
        </div>
        <div class="form-group">
            <label>진행 상태</label>
            <select id="status" required>
                <option value="pending">대기</option>
                <option value="in-progress">진행중</option>
                <option value="completed">완료</option>
                <option value="on-hold">보류</option>
            </select>
        </div>
        <div class="form-group">
            <label>우선순위</label>
            <select id="priority" required>
                <option value="very-high">매우 높음</option>
                <option value="high">높음</option>
                <option value="middle" selected>중간</option>
                <option value="low">낮음</option>
                <option value="very-low">매우 낮음</option>
            </select>
        </div>
        <div class="form-group">
            <label>체크리스트 (하위 업무)</label>
            <div id="subtask-container" class="subtask-container">
                <div class="subtask-input-group">
                    <input type="text" id="newSubtaskTitle" placeholder="항목 입력 후 '추가' 클릭"
                        onkeydown="if(event.key === 'Enter') { event.preventDefault(); addSubtask(); }">
                    <button type="button" class="btn-add-subtask">추가</button>
                </div>
                <div id="subtaskList" class="subtask-list">
                    <!-- 하위 업무 항목들이 여기에 추가됩니다 -->
                </div>
            </div>
        </div>
        <div class="form-group">
            <label>메모</label>
            <div id="description-editor" style="height: 150px; background: white; margin-bottom: 20px;"></div>
            <input type="hidden" id="description">
        </div>
        <div class="modal-buttons">
            <button type="submit" class="btn-save">저장</button>
            <button type="button" class="btn-delete">삭제</button>
            <button type="button" class="btn-cancel">취소</button>
        </div>
    </form>
</div>
