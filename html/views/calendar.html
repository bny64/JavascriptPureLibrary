<div class="main-content">
    <!-- 왼쪽: 캘린더 (75%) -->
    <div class="calendar-section">
        <div class="calendar-header">
            <button id="prevMonthBtn">◀</button>
            <h2 id="currentMonth"></h2>
            <button id="nextMonthBtn">▶</button>
            <button class="btn-all-tasks" id="openAllTasksBtn">📋 전체보기</button>
        </div>
        <div class="calendar" id="calendar"></div>
    </div>

    <!-- 오른쪽 (25%) -->
    <div class="right-section">
        <div class="tasks-section">
            <div class="sticky-header-container">
                <div id="statusSummary" class="status-summary"></div>
                <div id="unfinishedTasksSummary" class="unfinished-tasks-summary">
                    <div class="unfinished-tasks-label">미완료 업무</div>
                    <div id="unfinishedTaskCount" class="unfinished-tasks-count">0</div>
                </div>
                <div id="prioritySummary" class="priority-summary"></div>
                <h3 id="selectedDateTitle">선택된 날짜의 업무</h3>
                <div id="selectedDateStatusFilters" class="selected-date-status-filters">
                    <button class="filter-btn active" data-status="전체">상태: 전체</button>
                    <button class="filter-btn" data-status="pending">대기</button>
                    <button class="filter-btn filter-btn-inprogress" data-status="in-progress">진행중</button>
                    <button class="filter-btn" data-status="completed">완료</button>
                    <button class="filter-btn" data-status="on-hold">보류</button>
                </div>
            </div>
            <div class="tasks-content-wrapper">
                <div class="tasks-list" id="tasksList"></div>
            </div>
        </div>
    </div>
</div>
