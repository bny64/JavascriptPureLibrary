<div class="dashboard-container">
    <h2 class="dashboard-title">업무 현황 대시보드</h2>
    <div class="dashboard-summary-grid" id="dashboardSummary">
        <!-- 요약 카드가 여기에 렌더링됩니다 -->
    </div>

    <!-- 긴급 / 연체 업무 리포트 -->
    <div id="criticalTasksSection" class="dashboard-card critical-alert-section"
        style="display: none; margin-bottom: 25px; border-left: 5px solid #f44336;">
        <div class="critical-header"
            style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3 style="margin: 0; color: #d32f2f;">🚨 집중 관리 업무 (긴급/연체)</h3>
            <span class="critical-count-badge" id="criticalTaskCount"
                style="background: #f44336; color: white; padding: 2px 10px; border-radius: 20px; font-size: 13px; font-weight: bold;">0</span>
        </div>
        <div id="criticalTaskList" class="critical-task-list">
            <!-- 긴급 업무들이 여기에 렌더링됩니다 -->
        </div>
    </div>
    <div class="dashboard-charts-grid">
        <div class="dashboard-card" style="height: 420px; display: flex; flex-direction: column;">
            <h3>📊 상태별 분포</h3>
            <div style="position: relative; flex-grow: 1;">
                <canvas id="statusChartCanvas"></canvas>
            </div>
        </div>
        <div class="dashboard-card" style="height: 420px; display: flex; flex-direction: column;">
            <h3>🔥 우선순위 현황</h3>
            <div style="position: relative; flex-grow: 1;">
                <canvas id="priorityChartCanvas"></canvas>
            </div>
        </div>
    </div>
    <div class="dashboard-card full-width"
        style="height: 400px; margin-bottom: 20px; display: flex; flex-direction: column;">
        <h3>📈 주간 업무 처리량 트렌드 (최근 14일)</h3>
        <div style="position: relative; flex-grow: 1;">
            <canvas id="trendChartCanvas"></canvas>
        </div>
    </div>
    <div class="dashboard-header-actions" style="margin-bottom: 20px; text-align: right;">
        <button class="btn-archive" onclick="archiveOldTasks()"
            style="background: #607d8b; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: 600;">
            📦 30일 경과 업무 보관
        </button>
    </div>
    <div class="dashboard-charts-grid">
        <div class="dashboard-card" style="height: 400px; display: flex; flex-direction: column;">
            <h3>📊 월간 성과 분석 (최근 6개월)</h3>
            <div style="position: relative; flex-grow: 1;">
                <canvas id="monthlyAchievementChartCanvas"></canvas>
            </div>
        </div>
        <div class="dashboard-card" style="height: 400px; display: flex; flex-direction: column;">
            <h3>⏱️ 카테고리별 업무 비중 (Top 5)</h3>
            <div style="position: relative; flex-grow: 1;">
                <canvas id="categoryDistributionChartCanvas"></canvas>
            </div>
        </div>
    </div>
    <div class="dashboard-card full-width">
        <h3>📁 카테고리별 상세 진행률</h3>
        <div id="categoryProgressList" class="category-progress-list"></div>
    </div>
</div>
