<div class="dashboard-container">
    <h2 class="dashboard-title">업무 현황 대시보드</h2>
    <div class="dashboard-summary-grid" id="dashboardSummary">
        <!-- 요약 카드가 여기에 렌더링됩니다 -->
    </div>

    <div class="dashboard-alerts-grid">
        <!-- 긴급 / 연체 업무 리포트 -->
        <div id="criticalTasksSection" class="dashboard-card critical-alert-section"
            style="display: none; border-left: 5px solid #f44336; height: fit-content;">
            <div class="critical-header"
                style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="margin: 0; color: #d32f2f;">🚨 집중 관리 업무 (긴급/연체)</h3>
                <span class="critical-count-badge" id="criticalTaskCount"
                    style="background: #f44336; color: white; padding: 2px 10px; border-radius: 20px; font-size: 13px; font-weight: bold;">0</span>
            </div>
            <div id="criticalTaskList" class="critical-task-list">
                <!-- 긴급 업무들이 여기에 렌더링됩니다 -->
            </div>
        </div>

        <!-- 병목 업무 리포트 -->
        <div id="bottleneckSection" class="dashboard-card bottleneck-section"
            style="display: none; border-left: 5px solid #ff9800; height: fit-content;">
            <div class="bottleneck-header"
                style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="margin: 0; color: #e65100;">🐢 진척 지연 업무 (병목 현상)</h3>
                <span class="bottleneck-count-badge" id="bottleneckCount"
                    style="background: #ff9800; color: white; padding: 2px 10px; border-radius: 20px; font-size: 13px; font-weight: bold;">0</span>
            </div>
            <div id="bottleneckList" class="bottleneck-list">
                <!-- 지연 업무들이 여기에 렌더링됩니다 -->
            </div>
        </div>
    </div>

    <!-- 업무 활성도 히트맵 -->
    <div class="dashboard-card full-width" style="margin-bottom: 25px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3>🗓️ 연간 업무 활성도 (처리량 히트맵)</h3>
            <div class="heatmap-legend"
                style="display: flex; gap: 5px; align-items: center; font-size: 12px; color: #666;">
                <span>Less</span>
                <div style="width: 12px; height: 12px; background: #ebedf0; border-radius: 2px;"></div>
                <div style="width: 12px; height: 12px; background: #9be9a8; border-radius: 2px;"></div>
                <div style="width: 12px; height: 12px; background: #40c463; border-radius: 2px;"></div>
                <div style="width: 12px; height: 12px; background: #30a14e; border-radius: 2px;"></div>
                <div style="width: 12px; height: 12px; background: #216e39; border-radius: 2px;"></div>
                <span>More</span>
            </div>
        </div>
        <div class="heatmap-wrapper" style="position: relative; margin-top: 10px;">
            <div id="heatmapMonths" class="heatmap-months"
                style="display: flex; font-size: 11px; color: #666; margin-bottom: 5px; margin-left: 30px;">
                <!-- 월 레이블이 여기에 렌더링됩니다 -->
            </div>
            <div style="display: flex;">
                <div class="heatmap-weekdays"
                    style="display: flex; flex-direction: column; justify-content: space-between; font-size: 9px; color: #999; margin-right: 5px; padding: 2px 0;">
                    <span>Sun</span><span>Tue</span><span>Thu</span><span>Sat</span>
                </div>
                <div id="activityHeatmap" class="activity-heatmap" style="overflow-x: auto; padding-bottom: 10px;">
                    <!-- 히트맵이 여기에 렌더링됩니다 -->
                </div>
            </div>
        </div>
    </div>
    <div class="dashboard-charts-grid">
        <div class="dashboard-card" style="height: 420px; display: flex; flex-direction: column;">
            <h3>📊 상태별 분포</h3>
            <div style="position: relative; flex-grow: 1;">
                <canvas id="statusChartCanvas"></canvas>
            </div>
        </div>
        <div class="dashboard-card" style="height: 420px; display: flex; flex-direction: column;">
            <h3>🔥 우선순위 현황</h3>
            <div style="position: relative; flex-grow: 1;">
                <canvas id="priorityChartCanvas"></canvas>
            </div>
        </div>
    </div>
    <div class="dashboard-card full-width"
        style="height: 400px; margin-bottom: 20px; display: flex; flex-direction: column;">
        <h3>📈 주간 업무 처리량 트렌드 (최근 14일)</h3>
        <div style="position: relative; flex-grow: 1;">
            <canvas id="trendChartCanvas"></canvas>
        </div>
    </div>
    <div class="dashboard-header-actions" style="margin-bottom: 20px; text-align: right;">
        <button class="btn-archive" onclick="archiveOldTasks()"
            style="background: #607d8b; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: 600;">
            📦 30일 경과 업무 보관
        </button>
    </div>
    <div class="dashboard-charts-grid">
        <div class="dashboard-card" style="height: 400px; display: flex; flex-direction: column;">
            <h3>📊 월간 성과 분석 (최근 6개월)</h3>
            <div style="position: relative; flex-grow: 1;">
                <canvas id="monthlyAchievementChartCanvas"></canvas>
            </div>
        </div>
        <div class="dashboard-card" style="height: 400px; display: flex; flex-direction: column;">
            <h3>🏙️ 카테고리별 평균 소요 시간 (완료 업무 기준)</h3>
            <div style="position: relative; flex-grow: 1;">
                <canvas id="leadTimeChartCanvas"></canvas>
            </div>
        </div>
        <div class="dashboard-card" style="height: 400px; display: flex; flex-direction: column;">
            <h3>⏱️ 카테고리별 업무 비중 (Top 5)</h3>
            <div style="position: relative; flex-grow: 1;">
                <canvas id="categoryDistributionChartCanvas"></canvas>
            </div>
        </div>
        <div class="dashboard-card" style="height: 400px; display: flex; flex-direction: column;">
            <h3>📅 요일별 성과 분석 (최근 90일)</h3>
            <div style="position: relative; flex-grow: 1;">
                <canvas id="dayOfWeekChartCanvas"></canvas>
            </div>
        </div>
    </div>
    <div class="dashboard-card full-width">
        <h3>📁 카테고리별 상세 진행률</h3>
        <div id="categoryProgressList" class="category-progress-list"></div>
    </div>
</div>
