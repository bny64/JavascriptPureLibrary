<div class="report-container">
    <div class="report-header">
        <div class="report-title-group">
            <h2 class="report-title">📊 성과 분석</h2>
            <p class="report-subtitle">업무 수행 데이터 분석 및 개선 인사이트 제공</p>
        </div>
        <div class="report-actions">
            <!-- 필터링이나 다운로드 버튼 추가 가능 -->
            <button class="btn-refresh" id="refreshReportBtn">🔄 데이터 갱신</button>
        </div>
    </div>

    <!-- 핵심 성과 지표 (KPIs) -->
    <div class="kpi-grid">
        <div class="kpi-card">
            <div class="kpi-label">전체 등록 업무</div>
            <div class="kpi-value" id="kpiTotalTasks">0</div>
            <div class="kpi-desc">누적 등록 완료된 모든 업무</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-label">업무 완료율</div>
            <div class="kpi-value" id="kpiCompletionRate">0%</div>
            <div class="kpi-progress">
                <div class="kpi-progress-bar" id="kpiCompletionProgressBar" style="width: 0%"></div>
            </div>
        </div>
        <div class="kpi-card">
            <div class="kpi-label">평근 소요 기간</div>
            <div class="kpi-value" id="kpiAvgLeadTime">0일</div>
            <div class="kpi-desc">완료까지의 기간</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-label">지연 업무 건수</div>
            <div class="kpi-value danger" id="kpiOverdueTasks">0</div>
            <div class="kpi-desc">마감일이 지난 미완료 업무</div>
        </div>
    </div>

    <!-- 상세 분석 차트 영역 -->
    <div class="report-charts-grid">
        <!-- 1. 주간 생산성 트렌드 -->
        <div class="chart-box full-width">
            <div class="chart-header" style="display: flex; justify-content: space-between; align-items: flex-start;">
                <div>
                    <h3 class="chart-title">📈 업무 처리량 트렌드</h3>
                    <p class="chart-desc">신규 등록 업무 대비 완료 업무의 비율 변화</p>
                </div>
                <div class="chart-period-selector" id="reportTrendPeriodSelector">
                    <button class="btn-period" data-days="7">1주</button>
                    <button class="btn-period" data-days="14">2주</button>
                    <button class="btn-period active" data-days="30">1개월</button>
                    <button class="btn-period" data-days="90">3개월</button>
                    <button class="btn-period" data-days="180">6개월</button>
                    <button class="btn-period" data-days="365">1년</button>
                </div>
            </div>
            <div class="chart-content">
                <div class="chart-wrapper" style="height: 350px; position: relative;">
                    <canvas id="productivityTrendChart"></canvas>
                </div>
            </div>
        </div>

        <!-- 2. 업무 상태 분포 -->
        <div class="chart-box">
            <div class="chart-header">
                <h3 class="chart-title">📊 업무 상태 분포</h3>
            </div>
            <div class="chart-content">
                <div class="chart-wrapper" style="height: 250px; position: relative;">
                    <canvas id="statusDistributionChart"></canvas>
                </div>
            </div>
        </div>

        <!-- 3. 카테고리별 업무 집중도 -->
        <div class="chart-box">
            <div class="chart-header">
                <h3 class="chart-title">📁 카테고리별 업무 비중 TOP 10</h3>
            </div>
            <div class="chart-content">
                <div class="chart-wrapper" style="height: 250px; position: relative;">
                    <canvas id="categoryDistributionChart"></canvas>
                </div>
            </div>
        </div>

        <!-- 4. 우선순위별 완료 효율 -->
        <div class="chart-box">
            <div class="chart-header">
                <h3 class="chart-title">⚡ 우선순위별 완료 효율</h3>
            </div>
            <div class="chart-content">
                <div class="chart-wrapper" style="height: 250px; position: relative;">
                    <canvas id="priorityEfficiencyChart"></canvas>
                </div>
            </div>
        </div>

        <!-- 5. 월간 업무 완료 추이 -->
        <div class="chart-box">
            <div class="chart-header">
                <h3 class="chart-title">📅 월간 성과 분석 (최근 6개월)</h3>
            </div>
            <div class="chart-content">
                <div class="chart-wrapper" style="height: 250px; position: relative;">
                    <canvas id="monthlyTrendChart"></canvas>
                </div>
            </div>
        </div>

        <!-- 6. 요일별 업무 활성도 -->
        <div class="chart-box">
            <div class="chart-header">
                <h3 class="chart-title">🗓️ 요일별 업무 활성도</h3>
            </div>
            <div class="chart-content">
                <div class="chart-wrapper" style="height: 250px; position: relative;">
                    <canvas id="dailyActivityChart"></canvas>
                </div>
            </div>
        </div>

        <!-- 7. 주요 중분류 TOP 5 -->
        <div class="chart-box">
            <div class="chart-header">
                <h3 class="chart-title">🔍 주요 중분류 TOP 10</h3>
            </div>
            <div class="chart-content">
                <div class="chart-wrapper" style="height: 250px; position: relative;">
                    <canvas id="subCategoryChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>
