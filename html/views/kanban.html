<div class="kanban-container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 class="kanban-title" style="margin-bottom: 0;">업무 칸반 보드</h2>
        <div class="kanban-tabs" style="display: flex; gap: 5px; background: #eee; padding: 4px; border-radius: 8px;">
            <button class="tab-btn active" data-group="status"
                style="padding: 6px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; transition: all 0.2s;">상태별</button>
            <button class="tab-btn" data-group="priority"
                style="padding: 6px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; transition: all 0.2s;">우선순위별</button>
        </div>
    </div>
    <div class="kanban-board" id="kanban-board-container">
        <!-- JavaScript에서 동적으로 생성됨 -->
    </div>
</div>
