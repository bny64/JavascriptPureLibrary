<div class="kanban-container">
    <h2 class="kanban-title">업무 칸반 보드</h2>
    <div class="kanban-board">
        <div class="kanban-column" data-status="pending" ondragover="allowDrop(event)" ondrop="dropTask(event)">
            <div class="kanban-column-header status-pending">
                대기 <span class="count">0</span>
                <input type="text" class="kanban-search-input" placeholder="검색" onkeyup="filterKanbanColumn('pending', this.value)">
            </div>
            <div class="kanban-tasks" id="kanban-pending"></div>
        </div>
        <div class="kanban-column" data-status="in-progress" ondragover="allowDrop(event)" ondrop="dropTask(event)">
            <div class="kanban-column-header status-in-progress">
                진행중 <span class="count">0</span>
                <input type="text" class="kanban-search-input" placeholder="검색" onkeyup="filterKanbanColumn('in-progress', this.value)">
            </div>
            <div class="kanban-tasks" id="kanban-in-progress"></div>
        </div>
        <div class="kanban-column" data-status="completed" ondragover="allowDrop(event)" ondrop="dropTask(event)">
            <div class="kanban-column-header status-completed">
                완료 <span class="count">0</span>
                <input type="text" class="kanban-search-input" placeholder="검색" onkeyup="filterKanbanColumn('completed', this.value)">
            </div>
            <div class="kanban-tasks" id="kanban-completed"></div>
        </div>
        <div class="kanban-column" data-status="on-hold" ondragover="allowDrop(event)" ondrop="dropTask(event)">
            <div class="kanban-column-header status-on-hold">
                보류 <span class="count">0</span>
                <input type="text" class="kanban-search-input" placeholder="검색" onkeyup="filterKanbanColumn('on-hold', this.value)">
            </div>
            <div class="kanban-tasks" id="kanban-on-hold"></div>
        </div>
    </div>
</div>
