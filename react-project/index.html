<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React Samples Dashboard</title>
    <!-- 폐쇄망 환경을 고려한 로컬 라이브러리 참조 (Production/Minified) -->
    <script src="./frontend/lib/react.production.min.js" crossorigin></script>
    <script src="./frontend/lib/react-dom.production.min.js" crossorigin></script>
    <script src="./frontend/lib/react-hook-form.min.js"></script>
    <script src="./frontend/lib/chart.min.js"></script>

    <!-- 공통 및 레이아웃 스타일 -->
    <link rel="stylesheet" href="./frontend/styles/style.css?v=3" />
    <link rel="stylesheet" href="./frontend/styles/dashboard-layout.css?v=3" />
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;600;700&display=swap"
        rel="stylesheet" />
</head>

<body>
    <div id="root"></div>

    <script type="module">
        import html from './frontend/lib/htmEngine.js';
        const { useState, useMemo } = window.React;

        // 컴포넌트 임포트
        import CustomInput from './frontend/components/CustomInput.js?v=4';
        import ChartSample from './frontend/modules/visualization/ChartSample.js?v=4';
        import StandardForm from './frontend/modules/form-validation/StandardForm.js?v=4';
        import ValidationLab from './frontend/modules/form-validation/ValidationLab.js?v=4';

        const App = () => {
            const [searchQuery, setSearchQuery] = useState('');
            const [currentView, setCurrentView] = useState('validation-lab');
            const [serverError, setServerError] = useState(false);
            const [targetPort, setTargetPort] = useState(null);

            const switchToProject = async (port) => {
                setTargetPort(port);
                try {
                    const controller = new AbortController();
                    const id = setTimeout(() => controller.abort(), 1500);
                    
                    // 서버 생존 확인
                    await fetch(`http://localhost:${port}/`, { 
                        mode: 'no-cors',
                        signal: controller.signal 
                    });
                    
                    clearTimeout(id);
                    window.location.href = `http://localhost:${port}/`;
                } catch (e) {
                    setServerError(true);
                    setTimeout(() => { setServerError(false); }, 3000);
                }
            };

            const menuGroups = useMemo(() => [
                {
                    name: 'Validation Laboratory',
                    items: [
                        {
                            id: 'validation-lab',
                            title: 'Validation Integrated Lab',
                            desc: '3종 유효성 검사 전략 비교 (Standard, Manual, Array)',
                            component: ValidationLab
                        },
                        {
                            id: 'react-hook-form-standard',
                            title: 'Standard Hook Form',
                            desc: 'useForm 기반 실무형 단일 폼 샘플',
                            component: StandardForm
                        }
                    ]
                },
                {
                    name: 'Data Visualization',
                    items: [
                        {
                            id: 'chart-js',
                            title: 'Chart.js Visual Lab',
                            desc: 'React와 Chart.js의 데이터 연동 테스트',
                            component: ChartSample
                        }
                    ]
                }
            ], []);

            const allItems = useMemo(() => menuGroups.flatMap(g => g.items), [menuGroups]);

            const filteredMenuGroups = useMemo(() => {
                const query = searchQuery.toLowerCase();
                return menuGroups.map(group => {
                    const isGroupNameMatch = group.name.toLowerCase().includes(query);
                    return {
                        ...group,
                        items: group.items.filter(item =>
                            isGroupNameMatch ||
                            item.title.toLowerCase().includes(query) ||
                            item.desc.toLowerCase().includes(query)
                        )
                    };
                });
            }, [searchQuery, menuGroups]);

            const ActiveComponent = useMemo(() => {
                const found = allItems.find(item => item.id === currentView);
                return found ? found.component : null;
            }, [allItems, currentView]);

            const currentMenuTitle = useMemo(() => {
                const found = allItems.find(item => item.id === currentView);
                return found ? found.title : 'Library Lab';
            }, [allItems, currentView]);

            return html`
                <div className="dashboard-container">
                    <!-- Sidebar -->
                    <aside className="dashboard-sidebar">
                        <div className="sidebar-header">
                            <img src="./frontend/assets/logo.png" alt="React Logo" style=${{ width: '48px', height: '48px', marginBottom: '12px', filter: 'drop-shadow(0 0 8px rgba(97, 218, 251, 0.4))' }} />
                            <h2>React Library Lab</h2>
                            <p>Testing Sandbox</p>

                            <div className="project-switcher">
                                <span className="switcher-label">Project Switch</span>
                                <button className="switcher-btn" onClick=${() => switchToProject(3001)} title="Switch to Vue Library Lab (Port 3001)">V</button>
                                <button className="switcher-btn active" title="React Library Lab (Port 3002)">R</button>
                            </div>
                        </div>

                        ${serverError && html`
                            <div className="server-status-msg">
                                ⚠️ 서버가 실행중이지 않습니다. (Port: ${targetPort})
                            </div>
                        `}

                        <div className="sidebar-search">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                                <circle cx="11" cy="11" r="8" />
                                <line x1="21" y1="21" x2="16.65" y2="16.65" />
                            </svg>
                            <input
                                type="text"
                                value=${searchQuery}
                                onInput=${e => setSearchQuery(e.target.value)}
                                placeholder="컴포넌트 검색..."
                            />
                        </div>

                        <nav className="sidebar-menu">
                            ${filteredMenuGroups.map((category, index) => html`
                                <${window.React.Fragment} key=${category.name + index}>
                                    ${category.items.length > 0 && html`<div className="menu-category">${category.name}</div>`}
                                    ${category.items.map(item => html`
                                        <div
                                            key=${item.id}
                                            className="menu-item ${currentView === item.id ? 'active' : ''}"
                                            onClick=${() => setCurrentView(item.id)}
                                        >
                                            ${item.title}
                                            <span className="menu-item-desc">${item.desc}</span>
                                        </div>
                                    `)}
                                </${window.React.Fragment}>
                            `)}
                        </nav>
                    </aside>

                    <!-- Main Content -->
                    <main className="dashboard-main">
                        <header className="main-header">
                            <h3>${currentMenuTitle}</h3>
                        </header>

                        <section className="main-content">
                            <div className="content-inner">
                                ${ActiveComponent ? html`<${ActiveComponent} />` : null}
                            </div>
                        </section>
                    </main>
                </div>
            `;
        };

        const root = window.ReactDOM.createRoot(document.getElementById('root'));
        root.render(html`<${App} />`);
    </script>
</body>
</html>
