<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>업무 관리 시스템</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="themes.css">
    <link rel="stylesheet" href="lib/frappe-gantt.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <div class="view-selector">
                    <button class="current-view">📅 일정 관리</button>
                    <div class="view-dropdown">
                        <a href="#" id="dashboardViewLink">📈 대시보드</a>
                        <a href="#" id="calendarViewLink">📅 일정 관리</a>
                        <a href="#" id="ganttViewLink">📊 간트 차트</a>
                        <a href="#" id="kanbanViewLink">📋 칸반 보드</a>
                    </div>
                </div>
                <div class="global-search-container">
                    <input type="text" id="globalSearchInput" placeholder="🔍 업무 제목, 내용 검색..." onkeyup="handleGlobalSearch(event)">
                    <div id="globalSearchResults" class="global-search-results"></div>
                </div>
                <div class="theme-selector">
                    <label>테마:</label>
                    <select id="themeSelect" onchange="changeTheme(this.value)">
                        <option value="green">녹색</option>
                        <option value="blue">파란색</option>
                        <option value="purple">보라색</option>
                        <option value="orange">주황색</option>
                        <option value="pink">분홍색</option>
                        <option value="teal">청록색</option>
                        <option value="red">빨간색</option>
                        <option value="indigo">남색</option>
                        <option value="brown">갈색</option>
                        <option value="gray">회색</option>
                    </select>
                </div>
            </div>
            <div class="header-buttons">
                <div class="notification-container">
                    <button id="notificationBtn" class="btn-notification">
                        🔔 <span id="notificationCount" class="notification-count">0</span>
                    </button>
                    <div id="notificationDropdown" class="notification-dropdown">
                        <h4 id="notificationDropdownTitle">1주일 이내 종료 예정 업무</h4>
                        <ul id="notificationList">
                            <!-- Notifications will be rendered here by JavaScript -->
                            <li>알림 없음</li>
                        </ul>
                    </div>
                </div>
                <button id="notificationSettingsBtn" class="btn-notification-settings" onclick="openNotificationSettingsModal()">⚙️ 알림 설정</button>
                <button class="btn-category" onclick="openCategoryModal()">📁 분류 관리</button>
                <button class="btn-add" onclick="openTaskModal()">+ 새 업무 추가</button>
            </div>
        </header>

        <div id="calendar-view" class="view-container" style="display: none;">
            <div class="main-content">
                <!-- 왼쪽: 캘린더 (75%) -->
                <div class="calendar-section">
                    <div class="calendar-header">
                        <button onclick="previousMonth()">◀</button>
                        <h2 id="currentMonth"></h2>
                        <button onclick="nextMonth()">▶</button>
                        <button class="btn-all-tasks" onclick="openAllTasksModal()">📋 전체보기</button>
                    </div>
                    <div class="calendar" id="calendar"></div>
                </div>

                <!-- 오른쪽 (25%) -->
                <div class="right-section">
                    <div class="tasks-section">
                        <div class="sticky-header-container">
                            <div id="statusSummary" class="status-summary"></div>
                            <div id="unfinishedTasksSummary" class="unfinished-tasks-summary">
                                <div class="unfinished-tasks-label">미완료 업무</div>
                                <div id="unfinishedTaskCount" class="unfinished-tasks-count">0</div>
                            </div>
                            <div id="prioritySummary" class="priority-summary"></div>
                            <h3 id="selectedDateTitle">선택된 날짜의 업무</h3>
                            <div id="selectedDateStatusFilters" class="selected-date-status-filters">
                                <button class="filter-btn active" onclick="filterSelectedDateTasksByStatus('전체')" data-status="전체">상태: 전체</button>
                                <button class="filter-btn" onclick="filterSelectedDateTasksByStatus('대기')" data-status="대기">대기</button>
                                <button class="filter-btn filter-btn-inprogress" onclick="filterSelectedDateTasksByStatus('진행중')" data-status="진행중">진행중</button>
                                <button class="filter-btn" onclick="filterSelectedDateTasksByStatus('완료')" data-status="완료">완료</button>
                                <button class="filter-btn" onclick="filterSelectedDateTasksByStatus('보류')" data-status="보류">보류</button>
                            </div>
                        </div>
                        <div class="tasks-content-wrapper">
                            <div class="tasks-list" id="tasksList"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div id="gantt-chart-view" class="view-container" style="display: none;">
            <div class="gantt-chart-container">
                <h2 class="gantt-chart-title">간트 차트</h2>
                <div class="gantt-filters">
                    <div class="status-filters">
                        <button class="filter-btn active" onclick="filterGanttByStatus('전체')" data-status="전체">상태: 전체</button>
                        <button class="filter-btn" onclick="filterGanttByStatus('대기')" data-status="대기">대기</button>
                        <button class="filter-btn" onclick="filterGanttByStatus('진행중')" data-status="진행중">진행중</button>
                        <button class="filter-btn" onclick="filterGanttByStatus('완료')" data-status="완료">완료</button>
                        <button class="filter-btn" onclick="filterGanttByStatus('보류')" data-status="보류">보류</button>
                    </div>
                    <div class="priority-filters">
                        <button class="filter-btn active" onclick="filterGanttByPriority('전체')" data-priority="전체">우선순위: 전체</button>
                        <button class="filter-btn" onclick="filterGanttByPriority('very-high')" data-priority="very-high">매우 높음</button>
                        <button class="filter-btn" onclick="filterGanttByPriority('high')" data-priority="high">높음</button>
                        <button class="filter-btn" onclick="filterGanttByPriority('middle')" data-priority="middle">중간</button>
                        <button class="filter-btn" onclick="filterGanttByPriority('low')" data-priority="low">낮음</button>
                        <button class="filter-btn" onclick="filterGanttByPriority('very-low')" data-priority="very-low">매우 낮음</button>
                    </div>
                </div>
                <div id="gantt-target"></div>
            </div>
        </div>
        <div id="dashboard-view" class="view-container" style="display: none;">
            <div class="dashboard-container">
                <h2 class="dashboard-title">업무 현황 대시보드</h2>
                <div class="dashboard-summary-grid" id="dashboardSummary">
                    <!-- 요약 카드가 여기에 렌더링됩니다 -->
                </div>
                <div class="dashboard-charts-grid">
                    <div class="dashboard-card">
                        <h3>📊 상태별 분포</h3>
                        <div id="statusChart" class="chart-container"></div>
                    </div>
                    <div class="dashboard-card">
                        <h3>🔥 우선순위 현황</h3>
                        <div id="priorityChart" class="chart-container"></div>
                    </div>
                </div>
                <div class="dashboard-card full-width">
                    <h3>📁 카테고리별 진행률</h3>
                    <div id="categoryProgressList" class="category-progress-list"></div>
                </div>
            </div>
        </div>
        <div id="kanban-view" class="view-container" style="display: none;">
            <div class="kanban-container">
                <h2 class="kanban-title">업무 칸반 보드</h2>
                <div class="kanban-board">
                    <div class="kanban-column" data-status="대기" ondragover="allowDrop(event)" ondrop="dropTask(event)">
                        <div class="kanban-column-header status-대기">
                            대기 <span class="count">0</span>
                            <input type="text" class="kanban-search-input" placeholder="검색" onkeyup="filterKanbanColumn('대기', this.value)">
                        </div>
                        <div class="kanban-tasks" id="kanban-대기"></div>
                    </div>
                    <div class="kanban-column" data-status="진행중" ondragover="allowDrop(event)" ondrop="dropTask(event)">
                        <div class="kanban-column-header status-진행중">
                            진행중 <span class="count">0</span>
                            <input type="text" class="kanban-search-input" placeholder="검색" onkeyup="filterKanbanColumn('진행중', this.value)">
                        </div>
                        <div class="kanban-tasks" id="kanban-진행중"></div>
                    </div>
                    <div class="kanban-column" data-status="완료" ondragover="allowDrop(event)" ondrop="dropTask(event)">
                        <div class="kanban-column-header status-완료">
                            완료 <span class="count">0</span>
                            <input type="text" class="kanban-search-input" placeholder="검색" onkeyup="filterKanbanColumn('완료', this.value)">
                        </div>
                        <div class="kanban-tasks" id="kanban-완료"></div>
                    </div>
                    <div class="kanban-column" data-status="보류" ondragover="allowDrop(event)" ondrop="dropTask(event)">
                        <div class="kanban-column-header status-보류">
                            보류 <span class="count">0</span>
                            <input type="text" class="kanban-search-input" placeholder="검색" onkeyup="filterKanbanColumn('보류', this.value)">
                        </div>
                        <div class="kanban-tasks" id="kanban-보류"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 전체 업무 목록 모달 -->
    <div id="allTasksModal" class="modal">
        <div class="modal-content all-tasks-modal-content">
            <span class="close" onclick="closeAllTasksModal()">&times;</span>
            <h2>전체 업무 목록</h2>
            
            <div class="search-container">
                <div class="search-type">
                    <label><input type="radio" name="searchType" value="text" checked onchange="toggleSearchType()"> 단어 검색</label>
                    <label><input type="radio" name="searchType" value="category" onchange="toggleSearchType()"> 선택 검색</label>
                </div>
                
                <div id="textSearchBox" class="search-box">
                    <input type="text" id="textSearchInput" placeholder="업무명 또는 내용으로 검색..." onkeyup="searchAllTasks()">
                </div>
                
                <div id="categorySearchBox" class="search-box" style="display: none;">
                    <select id="searchCategory1" onchange="updateSearchCategory2(); searchAllTasks()"><option value="">전체 대분류</option></select>
                    <select id="searchCategory2" onchange="updateSearchCategory3(); searchAllTasks()"><option value="">전체 중분류</option></select>
                    <select id="searchCategory3" onchange="searchAllTasks()"><option value="">전체 소분류</option></select>
                </div>

                <div class="sort-controls">
                    <label for="sortField">정렬 기준:</label>
                    <select id="sortField" onchange="changeAllTasksSort()">
                        <option value="endDate">종료 날짜</option>
                        <option value="startDate">시작 날짜</option>
                        <option value="taskName">업무명</option>
                        <option value="status">상태</option>
                    </select>
                    <select id="sortDirection" onchange="changeAllTasksSort()">
                        <option value="asc">오름차순</option>
                        <option value="desc">내림차순</option>
                    </select>
                </div>
                
                <div class="status-filters">
                    <button class="filter-btn active" onclick="filterByStatus('전체')" data-status="전체">상태: 전체</button>
                    <button class="filter-btn" onclick="filterByStatus('대기')" data-status="대기">대기</button>
                    <button class="filter-btn" onclick="filterByStatus('진행중')" data-status="진행중">진행중</button>
                    <button class="filter-btn" onclick="filterByStatus('완료')" data-status="완료">완료</button>
                    <button class="filter-btn" onclick="filterByStatus('보류')" data-status="보류">보류</button>
                </div>
                <div class="priority-filters">
                    <button class="filter-btn active" onclick="filterByPriority('전체')" data-priority="전체">우선순위: 전체</button>
                    <button class="filter-btn" onclick="filterByPriority('very-high')" data-priority="very-high">매우 높음</button>
                    <button class="filter-btn" onclick="filterByPriority('high')" data-priority="high">높음</button>
                    <button class="filter-btn" onclick="filterByPriority('middle')" data-priority="middle">중간</button>
                    <button class="filter-btn" onclick="filterByPriority('low')" data-priority="low">낮음</button>
                    <button class="filter-btn" onclick="filterByPriority('very-low')" data-priority="very-low">매우 낮음</button>
                </div>
            </div>
            
            <div class="all-tasks-list-container">
                <div class="pagination-controls">
                    <button onclick="previousPage()" id="prevPageBtn">◀</button>
                    <span id="pageInfo">1 / 1</span>
                    <button onclick="nextPage()" id="nextPageBtn">▶</button>
                </div>
                <div class="all-tasks-list" id="allTasksList"></div>
            </div>
        </div>
    </div>

    <!-- 분류 관리 모달 -->
    <div id="categoryModal" class="modal">
        <div class="modal-content category-modal-content">
            <span class="close" onclick="closeCategoryModal()">&times;</span>
            <h2>분류 관리</h2>
            
            <div class="category-management">
                <div class="category-form">
                    <h3>새 분류 추가</h3>
                    <form id="categoryForm" onsubmit="saveCategory(event)">
                        <input type="hidden" id="categoryId">
                        <div class="form-group">
                            <label>대분류</label>
                            <input type="text" id="mainCategory" required placeholder="예: 개발">
                        </div>
                        <div class="form-group">
                            <label>중분류 (선택)</label>
                            <input type="text" id="subCategory" placeholder="예: 웹 개발">
                        </div>
                        <div class="form-group">
                            <label>소분류 (선택)</label>
                            <input type="text" id="detailCategory" placeholder="예: 프론트엔드">
                        </div>
                        <div class="modal-buttons">
                            <button type="submit" class="btn-save">저장</button>
                            <button type="button" class="btn-cancel" onclick="closeCategoryModal()">취소</button>
                        </div>
                    </form>
                </div>
                <div class="category-tree">
                    <h3>등록된 분류</h3>
                    <div id="categoryTreeView"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 업무 추가/수정 모달 -->
    <div id="taskModal" class="modal">
        <div class="modal-content task-modal-content">
            <span class="close" onclick="closeTaskModal()">&times;</span>
            <h2 id="modalTitle">새 업무 추가</h2>
            <form id="taskForm" onsubmit="saveTask(event)">
                <input type="hidden" id="taskId">
                <div class="form-group">
                    <label>대분류</label>
                    <select id="category1" required onchange="updateSubCategories()"><option value="">선택하세요</option></select>
                </div>
                <div class="form-group">
                    <label>중분류</label>
                    <select id="category2" onchange="updateDetailCategories()"><option value="">선택하세요</option></select>
                </div>
                <div class="form-group">
                    <label>소분류</label>
                    <select id="category3"><option value="">선택하세요</option></select>
                </div>
                <div class="form-group">
                    <label>업무명</label>
                    <input type="text" id="taskName" required placeholder="업무 이름을 입력하세요">
                </div>
                <div class="form-group">
                    <label>시작 날짜</label>
                    <input type="date" id="startDate">
                </div>
                <div class="form-group">
                    <label>종료 날짜</label>
                    <input type="date" id="endDate">
                </div>
                <div class="form-group">
                    <label>진행 상태</label>
                    <select id="status" required>
                        <option value="대기">대기</option>
                        <option value="진행중">진행중</option>
                        <option value="완료">완료</option>
                        <option value="보류">보류</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>우선순위</label>
                    <select id="priority" required>
                        <option value="very-high">매우 높음</option>
                        <option value="high">높음</option>
                        <option value="middle" selected>중간</option>
                        <option value="low">낮음</option>
                        <option value="very-low">매우 낮음</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>설명</label>
                    <textarea id="description" rows="4" placeholder="업무 설명을 입력하세요"></textarea>
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="btn-save">저장</button>
                    <button type="button" class="btn-cancel" onclick="closeTaskModal()">취소</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 중요 메모 모달 -->
    <div id="importantMemoModal" class="modal">
        <div class="modal-content memo-modal-content">
            <span class="close" onclick="closeImportantMemoModal()">&times;</span>
            <h2>중요 메모 관리</h2>
            <form id="memoForm" onsubmit="saveImportantMemo(event)">
                <input type="hidden" id="memoTaskId">
                <div class="form-group">
                    <label>중요 메모</label>
                    <textarea id="importantMemoContent" rows="8" placeholder="중요한 내용을 메모하세요"></textarea>
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="btn-save">저장</button>
                    <button type="button" class="btn-cancel" onclick="closeImportantMemoModal()">취소</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 알림 설정 모달 -->
    <div id="notificationSettingsModal" class="modal">
        <div class="modal-content notification-settings-modal-content">
            <span class="close" onclick="closeNotificationSettingsModal()">&times;</span>
            <h2>알림 설정</h2>
            <form id="notificationSettingsForm" onsubmit="saveNotificationSettings(event)">
                <div class="form-group">
                    <label for="notificationDaysBefore">종료일 D-Day (며칠 전):</label>
                    <input type="number" id="notificationDaysBefore" min="0" value="7">
                </div>
                <div class="form-group">
                    <label>우선순위:</label>
                    <div class="notification-priority-options">
                        <label><input type="checkbox" name="notificationPriority" value="very-high"> 매우 높음</label>
                        <label><input type="checkbox" name="notificationPriority" value="high"> 높음</label>
                        <label><input type="checkbox" name="notificationPriority" value="middle"> 중간</label>
                        <label><input type="checkbox" name="notificationPriority" value="low"> 낮음</label>
                        <label><input type="checkbox" name="notificationPriority" value="very-low"> 매우 낮음</label>
                    </div>
                </div>
                <div class="form-group">
                    <label>상태:</label>
                    <div class="notification-status-options">
                        <label><input type="checkbox" name="notificationStatus" value="대기"> 대기</label>
                        <label><input type="checkbox" name="notificationStatus" value="진행중"> 진행중</label>
                        <label><input type="checkbox" name="notificationStatus" value="보류"> 보류</label>
                        <!-- '완료' 상태는 알림 대상에서 제외하는 것이 일반적 -->
                    </div>
                </div>
                <div class="form-group">
                    <label for="notificationCategory1">카테고리 (대분류):</label>
                    <select id="notificationCategory1" onchange="populateNotificationSubCategories()"><option value="전체">전체</option></select>
                </div>
                <div class="form-group">
                    <label for="notificationCategory2">카테고리 (중분류):</label>
                    <select id="notificationCategory2" onchange="populateNotificationDetailCategories()"><option value="전체">전체</option></select>
                </div>
                <div class="form-group">
                    <label for="notificationCategory3">카테고리 (소분류):</label>
                    <select id="notificationCategory3"><option value="전체">전체</option></select>
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="btn-save">저장</button>
                    <button type="button" class="btn-cancel" onclick="closeNotificationSettingsModal()">취소</button>
                </div>
            </form>
        </div>
    </div>

    <script src="utils.js"></script>
    <script src="api.js"></script>
    <script src="ui.js"></script>
    <script src="app-modular.js"></script>
    <script src="lib/frappe-gantt.min.js"></script>
</body>
</html>
